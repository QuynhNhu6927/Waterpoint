<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hệ sinh thái tiện ích | Waterpoint | ERA Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TAB 4 "TIEN ICH" - dung chung token + khoi 3D bo 2 goc doi voi 3 tab kia.
   Khuon lay tu tong-quan/index.html, CAT bo toan bo lop phan khu
   (vung da giac SVG · nhan .pk · dai chip 8 phan khu · co che tap-trung),
   GIU lop gim tien ich + bang loc nhom, THEM tool cham diem (?tool=1)
   bung tu index.html cua tab Thuc te.

   🔴 BAY 53 (15/09) - TRUNG TEN CLASS: trang Thuc te co san class `.o` TRAN
      (chip chon canh) mang padding, nuot mat o icon cua gim. O day Em Teo
      dat thang ten `.oi`, va KHONG khai bat ky class 1-2 ky tu tran nao.
      Danh sach class tran cua file nay: .chip .k3d .mot .n2k .nh .oi .tab .ti
   ============================================================ */
:root{
  --wp-primary:#003C4B; --wp-primary-hover:#006D88; --wp-primary-tint:#7FD3E3;
  --wp-canvas:#000000; --wp-hairline:#005A70; --wp-on-primary:#FFFFFF;
  --wp-text:#FFFFFF; --wp-text-soft:rgba(255,255,255,.9);
  --wp-text-muted:rgba(255,255,255,.6); --wp-text-disabled:rgba(255,255,255,.3);
  --wp-surface-360:#0A1214;
  --wp-overlay-nav:rgba(0,60,75,.9); --wp-overlay-soft:rgba(0,60,75,.3);
  --wp-font:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --wp-fw-thin:100; --wp-fw-regular:400; --wp-fw-bold:700;
  --wp-fs-body:16px; --wp-fs-label:12px;
  --wp-space-xxs:4px; --wp-space-xs:8px; --wp-space-sm:12px;
  --wp-space-md:16px; --wp-space-lg:24px; --wp-space-xl:32px;
  --wp-radius-none:0px; --wp-radius-full:9999px;
  --wp-control-h:40px; --wp-control-h-lg:48px; --wp-nav-h:52px;
  --wp-z-overlay:50; --wp-z-toast:999999999;

  --wp-vang:#E0B14A;
  --wp-vang-canh:#8E6C1C;
  --wp-vang-mo:rgba(224,177,74,.34);
  --wp-canh-teal:#00232C;
  --wp-3d-do:0 6px 12px rgba(0,0,0,.42);
  --wp-trang-mo:rgba(255,255,255,.30);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--wp-canvas);
  font-family:var(--wp-font);color:var(--wp-text);-webkit-tap-highlight-color:transparent}
#pano{position:fixed;inset:0;background:var(--wp-surface-360)}
button{font-family:var(--wp-font);cursor:pointer;border:0}

/* ============ NUT - theo Group.svg Anh Tony gui 12/09 ============
   BO 2 GOC DOI NHAU (tren-phai + duoi-trai), ban kinh = 34% chieu cao.
   🔴 Doi mau nut phai doi bien `--nen`, KHONG set `background:` truc tiep. */
.k3d{
  --r:18px; --nen:var(--wp-primary);
  border-radius:0 var(--r) 0 var(--r);
  background:var(--nen);
  color:var(--wp-text);
  box-shadow:3px 3px 14px rgba(0,0,0,.26);
  transition:background .15s, box-shadow .15s, transform .08s;
}
.k3d:hover{--nen:var(--wp-primary-hover);background:var(--nen)}
.k3d:active,.k3d.nhan-xuong{transform:translateY(2px);
  box-shadow:1px 1px 6px rgba(0,0,0,.30)}
.k3d.vang{--nen:var(--wp-vang);background:var(--nen);color:var(--wp-primary)}
.k3d.vang:hover{--nen:#EBC069;background:var(--nen)}
.k3d.trang{--nen:var(--wp-text);background:var(--nen);color:var(--wp-primary)}
.k3d.trang:hover{--nen:#E8F3F6;background:var(--nen)}
.k3d:disabled{--nen:#0A2A34;background:var(--nen);color:rgba(255,255,255,.38);
  box-shadow:2px 2px 10px rgba(0,0,0,.22);cursor:not-allowed}
.k3d:disabled:hover{--nen:#0A2A34;background:var(--nen)}
.k3d:disabled:active{transform:none}

/* Ban kinh = 34% chieu cao, tinh rieng cho tung co nut */
.chip{--r:14px}
.tab{--r:18px}
#brand{--r:18px}
#bang{--r:22px}

/* ============ Gim tien ich ============
   🔴 BAY 51/52 (14/09): `.ti` la DIEM NEO KHONG KICH THUOC dat dung toa do;
      cham tron can giua diem neo nen BAT DONG. Nhan + cong day treo len
      bang position:absolute -> day nhan len bao nhieu cung khong keo cham
      roi khoi toa do that. Ban cu day ca khoi -> cham lech toi 131px.
   🔴 KHONG kep toa do vao trong man hinh: kep la cham bi dinh vao mep man
      nhu the dia danh do co that o do (do 14/09: lech 326px). */
#lop-ti{position:fixed;inset:0;z-index:38;pointer-events:none}
.ti{position:absolute;transform:translate(-50%,-50%);
  width:0;height:0;--cot:22px;
  pointer-events:none;cursor:pointer;will-change:transform;opacity:.88;
  transition:opacity .25s ease}
.ti:hover,.ti.sang{opacity:1;z-index:2}
.ti .nhan{--r:9px; --nen:var(--wp-overlay-nav);
  position:absolute;left:50%;bottom:50%;pointer-events:auto;
  transform:translateX(-50%) translateY(calc(-1 * var(--cot) + var(--dy,0px)));
  display:flex;align-items:stretch;gap:0;padding:0;background:none;
  font-size:11px;font-weight:var(--wp-fw-bold);letter-spacing:.4px;
  white-space:nowrap;line-height:1.2;color:var(--wp-text)}
.ti:hover .nhan,.ti.sang .nhan{--nen:var(--wp-primary-hover)}
.ti .nhan svg{width:13px;height:13px;flex:0 0 auto;display:block;fill:none;
  stroke:var(--wp-primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* O icon: rong 30px, ban kinh rieng 7px (12/09 - 9px thi hai goc cong an
   gan het o, icon 13px trong nhu bi day lech). */
.ti .nhan > .oi{display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;width:30px;background:var(--wp-text);
  border-radius:0 7px 0 7px;
  box-shadow:2px 2px 7px rgba(0,0,0,.26);position:relative;z-index:2}
.ti .nhan > .tx{display:flex;align-items:center;
  padding:5px var(--wp-space-sm) 5px 10px;
  background:var(--nen);border-radius:0 var(--r) 0 var(--r);
  box-shadow:2px 2px 7px rgba(0,0,0,.26)}
.ti .duong{position:absolute;left:50%;bottom:50%;width:1px;pointer-events:none;
  height:calc(var(--cot) - var(--dy,0px));transform:translateX(-50%);
  background:rgba(255,255,255,.6)}
/* Gim sat mep man: nhan can giua se bi CAT mat nua chu -> doi sang neo mep.
   Cham tron VAN dung cho, chi rieng nhan xe sang mot ben. */
.ti.trai .nhan{transform:translateX(-4px)
  translateY(calc(-1 * var(--cot) + var(--dy,0px)))}
.ti.phai .nhan{transform:translateX(calc(-100% + 4px))
  translateY(calc(-1 * var(--cot) + var(--dy,0px)))}
/* Thu ve chi con icon (chong chu / chui duoi bang) */
.ti.gon .nhan > .tx{display:none}
.ti.gon{--cot:10px}
.ti.gon:hover .nhan > .tx,.ti.gon.sang .nhan > .tx{display:flex}
.ti.gon .cham{width:10px;height:10px}
.ti .cham{position:absolute;left:50%;top:50%;pointer-events:auto;
  transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:var(--wp-radius-full);
  background:var(--wp-primary-tint);border:2px solid var(--wp-primary)}
/* Gim CHUA CHAM TOA DO (ath=null) khong bao gio duoc ve - xem batTheo() */

/* ============ Bang bat/tat lop ============ */
#bang{position:fixed;left:var(--wp-space-md);
  top:calc(var(--wp-space-md) + var(--wp-nav-h) + var(--wp-space-sm));
  z-index:var(--wp-z-overlay);width:246px;max-width:calc(100vw - 32px);
  padding:var(--wp-space-sm) var(--wp-space-md) var(--wp-space-md)}
#bang .tieu{font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);
  letter-spacing:.5px;text-transform:uppercase;color:var(--wp-primary-tint);
  margin-bottom:var(--wp-space-xs)}
#bang .lop{height:var(--wp-control-h);margin-top:var(--wp-space-xs);width:100%}
#bang .lop > .tx{flex:1}
#bang .con{margin:var(--wp-space-xs) 0 0 var(--wp-space-sm);
  display:flex;flex-direction:column;gap:var(--wp-space-xxs)}
#bang .con.an{display:none}
#bang .nh{display:flex;align-items:center;gap:var(--wp-space-xs);
  padding:5px var(--wp-space-xs);cursor:pointer;
  font-size:11px;letter-spacing:.3px;color:var(--wp-text-soft);background:none;border:0}
#bang .nh:hover{color:var(--wp-text)}
#bang .nh i{width:11px;height:11px;flex:0 0 auto;
  border:1px solid var(--wp-primary-tint);background:transparent}
#bang .nh.on i{background:var(--wp-primary-tint)}
#bang .nh.tat{opacity:.45}
@media (max-width:820px){ #bang{width:210px} }

/* ============ NUT 2 KHOI ============ */
.n2k{--r:16px; --nen:var(--wp-primary);
  display:inline-flex;align-items:stretch;border:0;padding:0;
  background:none;color:var(--wp-text);cursor:pointer;
  transition:transform .08s}
.n2k:hover{--nen:var(--wp-primary-hover)}
.n2k:active,.n2k.nhan-xuong{transform:translateY(2px)}
.n2k > .ic{display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;width:46px;align-self:stretch;background:var(--wp-text);
  border-radius:0 11px 0 11px;
  box-shadow:3px 3px 14px rgba(0,0,0,.26);
  position:relative;z-index:2}
.n2k > .ic svg{width:18px;height:18px;fill:none;stroke:var(--wp-primary);
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.n2k > .tx{display:flex;align-items:center;gap:var(--wp-space-xs);
  padding:0 var(--wp-space-md) 0 var(--wp-space-lg);white-space:nowrap;
  background:var(--nen);
  border-radius:0 var(--r) 0 var(--r);
  margin-left:calc(var(--r) * -1);padding-left:calc(var(--wp-space-lg) + var(--r));
  box-shadow:3px 3px 14px rgba(0,0,0,.26);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);
  letter-spacing:.9px;text-transform:uppercase}
/* 16/09 - BO HAN so dem trong bang (Anh Tony chot, cho giong trang Thuc te va
   Tong quan). Luat `.n2k > .tx .so` da xoa cung ngay. */
.n2k.tat{opacity:.5}
@media (max-height:600px){ .n2k{--r:13px} .n2k > .ic{width:34px} }

/* ============ Brand ============ */
#brand{position:fixed;top:var(--wp-space-md);left:var(--wp-space-md);z-index:var(--wp-z-overlay);
  min-height:var(--wp-nav-h);display:flex;align-items:center;gap:var(--wp-space-sm);
  padding:var(--wp-space-xs) var(--wp-space-md);cursor:default}
#brand:hover{--nen:var(--wp-primary)}
#brand:active{transform:none}
#brand img{height:28px;width:auto;display:block}
#brand .ten{font-size:var(--wp-fs-body);color:var(--wp-text);letter-spacing:.5px;line-height:1.15}
#brand .phu{font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:.5px;
  color:var(--wp-primary-tint);text-transform:uppercase;line-height:1.25}

/* ============ Thanh buoc ============ */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--wp-space-xl);
  z-index:var(--wp-z-overlay);display:flex;align-items:flex-start;
  gap:var(--wp-space-xs);max-width:calc(100vw - var(--wp-space-xl));
  overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:var(--wp-nav-h);padding:0 var(--wp-space-lg);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:1.1px;
  text-transform:uppercase;white-space:nowrap}
.tab.on{--nen:var(--wp-primary-hover)}
.tab:disabled{cursor:not-allowed}
.tab:disabled:active{transform:none}

/* ============ Man tai ============ */
#tai{position:fixed;inset:0;z-index:var(--wp-z-toast);background:var(--wp-canvas);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:.5px;
  text-transform:uppercase;color:var(--wp-primary-tint)}
#tai.xong{display:none}

/* ============ Nut mo bang (man hep hoac man thap) ============ */
#mo-bang{display:none!important;position:fixed;left:var(--wp-space-md);
  top:calc(var(--wp-space-md) + var(--wp-nav-h) + var(--wp-space-sm));
  z-index:calc(var(--wp-z-overlay) + 1);
  height:var(--wp-control-h)}
@media (max-width:820px), (max-height:600px){
  #mo-bang{display:inline-flex!important}
  #bang{display:none}
  html.mo-bang #bang{display:block}
  html.mo-bang #mo-bang{--nen:var(--wp-primary-hover);background:var(--nen)}
  #bang{width:230px;max-height:calc(100vh - 200px);overflow-y:auto;scrollbar-width:none}
  #bang::-webkit-scrollbar{display:none}
}
@media (max-height:600px){
  #bang{top:calc(var(--wp-space-xs) + var(--wp-nav-h));
        padding:var(--wp-space-xs) var(--wp-space-sm) var(--wp-space-sm)}
  #bang .lop{height:34px}
  #brand{min-height:40px;padding:4px var(--wp-space-sm)}
  #brand img{height:22px}
  #nav{bottom:var(--wp-space-sm)}
  .tab{height:44px;font-size:var(--wp-fs-label)}
}
@media (max-width:560px){
  #bang{width:calc(100vw - 32px)}
  .ti .nhan{font-size:10.5px}
  .ti .nhan > .tx{padding:4px var(--wp-space-xs) 4px 6px}
  .ti .nhan > .oi{width:24px} .ti .nhan svg{width:12px;height:12px}
  #brand .ten{font-size:13px}
}

/* ---- Tool cham diem (?tool=1) - bung tu index.html tab Thuc te ---- */
#tool{position:fixed;left:var(--wp-space-md);
  top:calc(var(--wp-space-md) + var(--wp-nav-h) + var(--wp-space-sm));
  z-index:var(--wp-z-overlay);width:320px;max-width:calc(100vw - 32px);
  max-height:calc(100vh - 200px);overflow-y:auto;
  background:var(--wp-overlay-nav);border:1px solid var(--wp-hairline);
  padding:var(--wp-space-md);display:none}
#tool.hien{display:block}
#tool .tieu{font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:.5px;
  color:var(--wp-vang);text-transform:uppercase;margin-bottom:var(--wp-space-xs)}
#tool .gt{font-size:var(--wp-fs-label);color:var(--wp-text-muted);line-height:1.5;
  margin-bottom:var(--wp-space-sm)}
.mot{display:block;width:100%;text-align:left;min-height:var(--wp-control-h);
  padding:var(--wp-space-xs) var(--wp-space-md);margin-bottom:var(--wp-space-xs);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:.5px}
.mot small{display:block;font-weight:var(--wp-fw-regular);letter-spacing:0;opacity:.7;margin-top:2px}
#tool .hang{display:flex;gap:var(--wp-space-xs);margin-top:var(--wp-space-md)}
#tool .hang button{flex:1;height:var(--wp-control-h);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:.5px}
#tro{position:fixed;left:50%;transform:translateX(-50%);top:var(--wp-space-md);
  z-index:var(--wp-z-toast);height:var(--wp-nav-h);display:none;align-items:center;
  padding:0 var(--wp-space-lg);font-size:var(--wp-fs-body)}
#tro.hien{display:flex}
#xuat{position:fixed;inset:var(--wp-space-xl);z-index:var(--wp-z-toast);
  background:var(--wp-overlay-nav);border:1px solid var(--wp-hairline);
  padding:var(--wp-space-lg);display:none;flex-direction:column;gap:var(--wp-space-md)}
#xuat.hien{display:flex}
#xuat textarea{flex:1;width:100%;background:var(--wp-canvas);color:var(--wp-text);
  border:1px solid var(--wp-hairline);padding:var(--wp-space-md);
  font-family:ui-monospace,Consolas,monospace;font-size:var(--wp-fs-label);
  line-height:1.5;resize:none;outline:none}
#xuat .hang{display:flex;gap:var(--wp-space-xs)}
#xuat .hang button{height:var(--wp-control-h-lg);padding:0 var(--wp-space-lg);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:.5px}
/* Mo tool thi GIAU bang lop - hai cai cung nam goc trai tren, de nhau */
html.co-tool #bang,html.co-tool #mo-bang{display:none!important}
</style></head><body>

<div id="pano"></div>
<div id="lop-ti"></div>

<div id="brand" class="k3d">
  <img id="logo-era" src="skin/logo-era.png" alt="ERA Vietnam" onerror="this.remove()">
  <div>
    <div class="ten">WATERPOINT</div>
    <div class="phu">Hệ sinh thái tiện ích</div>
  </div>
</div>

<button class="n2k" id="mo-bang" type="button">
  <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span>
  <span class="tx">Lớp hiển thị</span></button>

<div id="bang" class="k3d">
  <div class="tieu">Lớp hiển thị</div>
  <button class="n2k lop" id="l-ti" type="button">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-5.1-7-10a7 7 0 1 1 14 0c0 4.9-7 10-7 10z"/><circle cx="12" cy="11" r="2.6"/></svg></span>

  <div class="con" id="nhom-ti"></div>
</div>

<nav id="nav"></nav>

<div id="tool">
  <div class="tieu">Chấm gim tiện ích</div>
  <div class="gt">Chọn một dòng → bấm lên ảnh đúng chỗ tiện ích đó nằm.
    Bấm lại dòng đã chấm để xoá. Chấm được tới đâu hay tới đó, không cần đủ 32.
    Xong bấm XUẤT → CHÉP → gửi Em Tèo.</div>
  <div id="tool-ds"></div>
  <div class="gt" id="tool-dem"></div>

  <div class="hang">
    <button class="k3d vang" id="b-xuat">XUẤT</button>
    <button class="k3d" id="b-xoa">XOÁ NHÁP</button>
  </div>
</div>
<div class="k3d vang" id="tro"></div>
<div id="xuat">
  <textarea id="xuat-txt" readonly></textarea>
  <div class="hang"><button class="k3d vang" id="b-chep">CHÉP</button><button class="k3d" id="b-dong">ĐÓNG</button></div>
</div>

<div id="tai">Đang tải cảnh 360…</div>

<script src="krpano.js"></script>
<script>
"use strict";
var kp = null, TI = [], NHOM = [], hienTI = true, tatNhom = {};
var CANH = 'tien-ich';                    /* ten scene trong tour.xml */

embedpano({
  xml: "tour.xml", target: "pano", html5: "only", mobilescale: 1.0,
  passQueryParameters: true, bgcolor: "#000000",
  onready: function (k) {
    kp = k;
    document.getElementById('tai').classList.add('xong');
    requestAnimationFrame(batTheo);
  }
});

/* ---------------- Thanh bước ----------------
   🔴 Nav cua 4 tab dang HARD-CODE roi rac o 4 file (tong-quan doc du-an.json,
      3 tab kia viet thang). Them/bo tab la phai sua DU 4 CHO, khong thi tab
      nay hien ma tab kia khong. Da ghi vao nhat ky 15/09. */
/* veNav() da chuyen sang file dung chung `era-buoc.js` (15/09) */

/* ---------------- Icon tiện ích ----------------
   ERA tu ve bang SVG net mong, khung 24x24.
   🔴 KHONG dung anh gim cua CDT (muc 8.1 CLAUDE.md) - chi hoc CACH bay tri.
   8 icon duoi day la them moi 15/09 cho trang nay (chua nhatho thethao clb
   song trienlam nghiencuu dichvu); phan con lai giong bo cua tong-quan. */
var IC = {
  yte:      '<path d="M12 6v12M6 12h12"/>',
  muasam:   '<path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  hoc:      '<path d="M12 5l9 4-9 4-9-4 9-4z"/><path d="M7 11v5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-5"/>',
  golf:     '<path d="M9 19V4l8 4-8 4"/><path d="M6 20h7"/>',
  cay:      '<path d="M12 20v-6"/><path d="M12 14c-3.5 0-5-2.2-5-4.5S9 5 12 5s5 2.2 5 4.5S15.5 14 12 14z"/>',
  nha:      '<path d="M4 11l8-6 8 6"/><path d="M6 11v8h12v-8"/><path d="M10 19v-4h4v4"/>',

/* ============================================================
   Nhãn bám theo ảnh mỗi khung hình.
   🔴 PHAI dung JS API kp.spheretoscreen(...) - truyen so qua kp.call() thi
      tham so KHONG vao duoc (bay 46, do ngay 09/09).
   ============================================================ */

/* ---- Vật cản cố định trên màn: bảng "Lớp hiển thị" VÀ bảng tool ----
   🔴 15/09: trang tong-quan chi do moi #bang. O day co THEM #tool (mo bang
      ?tool=1, cao toi 530px tren iPad9 ngang) - dung chinh goc trai tren.
      Bo sot la 32 dong nhan de len bang tool, cham khong ra. Do CA HAI.
   🔴 BAY NHAP NHAY: thu ve cham xong thi `.tx` bi display:none, do lai ra
      hep -> het giao voi bang -> bung chu ra -> lai giao -> lap vo tan o
      60 khung/giay. Nen phai NHO so do nhan luc con hien du chu (le so voi
      diem neo) roi luon dung so da nho de tinh. */
var canTro = [];
function doVatCan() {
  canTro = [];
  ['bang', 'tool'].forEach(function (id) {
    var e = document.getElementById(id);
    if (e && getComputedStyle(e).display !== 'none') canTro.push(e.getBoundingClientRect());
  });
}

function dyCua(e) {
  return +(e.style.getPropertyValue('--dy') || '0').replace('px', '');
}

/* Hop chu nhat MA NHAN SE CHIEM neu no dang hien du chu, o muc day `dy`.
   So nho lai deu QUY VE dy = 0 roi moi cong `dy` dang xet vao. */
function hopNhan(e, x, y, dy) {
  var nh = e.querySelector('.nhan');
  if (!nh) return null;
  if (!e.classList.contains('gon')) {
    var r = nh.getBoundingClientRect();
    if (r.width > 0) {            /* font chua ve xong thi ra 0 - dung ghi de */
      e.dataset.nx = r.left - x;
      e.dataset.ny = r.top - y - dyCua(e);
      e.dataset.nw = r.width;
      e.dataset.nh = r.height;
    }
  }
  if (!e.dataset.nw) return null;
  var l = x + +e.dataset.nx, t = y + +e.dataset.ny + (dy || 0);
  return { left: l, top: t,
           right: l + +e.dataset.nw, bottom: t + +e.dataset.nh };
}

function duoiBang(e, x, y, dy) {
  if (!canTro.length) return false;
  var h = hopNhan(e, x, y, dy);
  if (!h) return false;
  var KHE = 6;
  for (var i = 0; i < canTro.length; i++) {
    var b = canTro[i];
    if (!(h.right  <= b.left   - KHE || h.left >= b.right  + KHE ||
          h.bottom <= b.top    - KHE || h.top  >= b.bottom + KHE)) return true;
  }
  return false;
}

function batTheo() {
  requestAnimationFrame(batTheo);
  if (!kp || !TI.length) return;

  var LT = document.getElementById('lop-ti');
  var bat = hienTI && kp.get('xml.scene') === CANH;
  LT.style.display = bat ? '' : 'none';
  if (!bat) return;

  var r = document.getElementById('pano').getBoundingClientRect();
  var sw = +kp.get('stagewidth') || r.width, sh = +kp.get('stageheight') || r.height;
  var fx = r.width / sw, fy = r.height / sh;
  var vv = huong(+kp.get('view.hlookat'), +kp.get('view.vlookat'));
  doVatCan();

  var hienTi = [];
  LT.querySelectorAll('.ti').forEach(function (e) {
    var p = TI[+e.dataset.k];
    /* 🔴 Gim chua cham toa do (ath === null) KHONG duoc ve. Ve voi ath=null
       thi spheretoscreen tra NaN -> gim dinh cung o goc trai tren man. */
    if (!p || p.ath === null || tatNhom[p.nhom] || !truocMat(vv, p.ath, p.atv)) {
      e.style.display = 'none'; return;
    }
    var s = kp.spheretoscreen(p.ath, p.atv);
    var x = s.x * fx, y = s.y * fy;
    e.style.display = '';
    var nh = e.querySelector('.nhan');
    /* Be rong THAT cua nhan, do moi khung khi dang hien du chu.
       🔴 Khong nho cung lan do dau tien: lan dau font chua ve xong,
          offsetWidth ra 0 -> lay mac dinh 140 -> nhan rong 205px van bi
          coi la hep -> de chong len nhau (do that 12/09 ben tong-quan). */
    if (!e.classList.contains('gon')) {
      var ow = nh.offsetWidth;
      if (ow > 40) e.dataset.w = ow;
    }
    var w = +e.dataset.w || 140;
    if (x < w / 2 + 8)                { e.classList.add('trai');  e.classList.remove('phai'); }
    else if (x > r.width - w / 2 - 8) { e.classList.add('phai');  e.classList.remove('trai'); }
    else                              { e.classList.remove('trai', 'phai'); }
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    hienTi.push({ e: e, x: x, y: y, w: w });
  });

  /* ---- Lượt 1: né chồng chữ, đẩy nhãn LÊN từng bậc ----
     🔴 Nguong "gan nhau" phai tinh theo BE RONG THAT cua hai nhan, KHONG
        duoc dat so co dinh (do 12/09: nhan rong 158px voi nguong 150 bi coi
        la "xa" nen khong day -> van de len nhau). */
  hienTi.sort(function (a, b) { return a.x - b.x; });
  var BAC = 34, TRAN = -136;      /* cao nhan 25 + khe 9; toi da 4 bac */
  for (var i = 0; i < hienTi.length; i++) {
    var dy = 0, cham = false;
    for (var j = 0; j < i; j++) {
      var dyj = dyCua(hienTi[j].e);
      var gan = (hienTi[i].w + hienTi[j].w) / 2 + 24;
      if (Math.abs(hienTi[i].x - hienTi[j].x) < gan &&
          Math.abs((hienTi[i].y + dy) - (hienTi[j].y + dyj)) < BAC) { dy -= BAC; j = -1; }
      if (dy <= TRAN) { cham = true; break; }
    }
    /* Qua 4 bac thi THU VE CHAM (cot leu ngheu con xau hon chong chu).
       Chui duoi bang "Lop hien thi" / bang tool cung la mot ly do thu ve,
       xet o DUNG MUC DAY `dy` vua tinh ra, khong xet o cho cu. */
    if (cham || duoiBang(hienTi[i].e, hienTi[i].x, hienTi[i].y, dy)) {
      hienTi[i].e.classList.add('gon'); hienTi[i].gon = true;
      hienTi[i].e.style.setProperty('--dy', '0px');
    } else {
      hienTi[i].e.classList.remove('gon'); hienTi[i].gon = false;
      hienTi[i].e.style.setProperty('--dy', dy + 'px');
    }
  }

  /* ---- Lượt 2: xếp riêng cho các gim đã thu về icon ----
     🔴 Cho chung dy=0 het thi cac icon lai chum dung mot cho, de len nhau y
        nhu luc con chu. Icon chi rong ~30px nen bac nho hon, cho cao hon. */
  var gons = hienTi.filter(function (t) { return t.gon; });
  var BAC2 = 26, TRAN2 = -156;
  for (var a = 0; a < gons.length; a++) {
    var dy2 = 0;
    for (var b = 0; b < a; b++) {
      var dyb = dyCua(gons[b].e);
      if (Math.abs(gons[a].x - gons[b].x) < 34 &&
          Math.abs((gons[a].y + dy2) - (gons[b].y + dyb)) < BAC2) { dy2 -= BAC2; b = -1; }
      if (dy2 <= TRAN2) break;
    }
    gons[a].e.style.setProperty('--dy', Math.max(TRAN2, dy2) + 'px');
  }
}

function huong(ath, atv) {
  var a = ath * Math.PI / 180, b = atv * Math.PI / 180;
  return [Math.cos(b) * Math.sin(a), -Math.sin(b), Math.cos(b) * Math.cos(a)];
}
function truocMat(vv, ath, atv) {
  var p = huong(ath, atv);
  return (vv[0] * p[0] + vv[1] * p[1] + vv[2] * p[2]) > 0.09;
}

/* ================= TOOL CHẤM ĐIỂM (?tool=1) =================
   Bung tu index.html cua tab Thuc te. Nhap luu localStorage khoa RIENG
   (`wp_tienich_gim`) de khong dam vao nhap dang cham cua tab Thuc te. */
var TOOL = new URLSearchParams(location.search).get('tool') === '1';
var KHOA = 'wp_tienich_gim', chonGim = null;
if (TOOL) document.documentElement.classList.add('co-tool');

function nhacTro(t) {
  var e = document.getElementById('tro');
  e.textContent = t || '';
  e.classList.toggle('hien', !!t);
}

/* Luu ca TEN / NHOM / ICON, vi Anh Tony tu them duoc tien ich moi ngay tren
   man hinh - diem do khong he co trong tien-ich.json.

   🔴🔴 KHOA `_ban` - CHONG NHAP CU GHI DE NGUOC LEN TOA DO DA CAM.
   Do that 15/09 dot 2 khi cam 23 toa do Anh Tony cham vao tien-ich.json:
   nhap trong trinh duyet VAN CON ban cu, mo lai trang la no chay 2 cai hai:
     (a) diem nao nhap ghi `ath: null` se DAT NGUOC toa do vua cam ve null
         => 23 diem bien mat, ma FILE van dung  -> tuong code hong, mo mo lai;
     (b) 7 diem Anh tu them co `them: true` va id `them-<dau-thoi-gian>` khong
         con trung id nao trong file => bi PUSH THEM LAN NUA -> NHAN DOI gim.
   ✅ Nhap luu kem so ban cua file luc luu. Mo trang thay so ban khac => nhap
      la ban CU tu truoc luc cam, BO HAN di.
   🔴 LUAT: moi lan cam toa do vao tien-ich.json thi TANG `_ban` len 1. */
var BAN = 0;
function luuNhap() {
  try {
    localStorage.setItem(KHOA, JSON.stringify({ _ban: BAN, ds: TI.map(function (p) {
      return { id: p.id, ten: p.ten, vitri: p.vitri, nhom: p.nhom, icon: p.icon,
               ath: p.ath, atv: p.atv, them: !!p.them };
    }) }));
  } catch (e) {}
}
function napNhap() {
  try {
    var n = JSON.parse(localStorage.getItem(KHOA) || 'null'); if (!n) return;
    /* Ban rat cu luu thang mot mang (chua co `_ban`) -> cung coi la lech ban. */
    if (!n.ds || n._ban !== BAN) { localStorage.removeItem(KHOA); return; }
    var g = n.ds, m = {};
    g.forEach(function (x) { m[x.id] = x; });
    TI.forEach(function (p) {
      if (m[p.id]) { p.ath = m[p.id].ath; p.atv = m[p.id].atv; delete m[p.id]; }
    });
    /* tien ich Anh Tony tu them tren man hinh - chua co trong file goc */
    g.forEach(function (x) { if (m[x.id] && x.them) TI.push(x); });
  } catch (e) {}
}

function veTool() {
  if (!TOOL || !TI.length) return;
  document.getElementById('tool').classList.add('hien');
  var L = document.getElementById('tool-ds'); L.innerHTML = '';
  NHOM.concat([{ id: '_them', ten: 'Anh Tony tự thêm' }]).forEach(function (g) {
    var ds = TI.filter(function (p) {
      return g.id === '_them' ? (p.them && !timNhom(p.nhom)) : p.nhom === g.id;
    });
    if (!ds.length) return;
    var xong = ds.filter(function (p) { return p.ath !== null; }).length;
    var h = document.createElement('div');
    h.className = 'gt';
    h.style.margin = 'var(--wp-space-sm) 0 var(--wp-space-xxs)';
    h.style.color = 'var(--wp-primary-tint)';
    h.textContent = g.ten + ' — ' + xong + '/' + ds.length;
    L.appendChild(h);
    ds.forEach(function (p) {
      var i = TI.indexOf(p), co = p.ath !== null;
      var b = document.createElement('button');
      b.className = 'k3d mot' + (chonGim === i ? ' vang' : '') + (co ? ' trang' : '');
      b.appendChild(document.createTextNode((co ? '✓ ' : '+ ') + p.ten));
      var s = document.createElement('small');
      /* `vitri` CHI hien o day - khach xem khong thay (Anh Tony chot 15/09) */
      s.textContent = co ? ('ath ' + p.ath + '°  ·  atv ' + p.atv + '°  ·  bấm để xoá')
                         : (p.vitri ? '→ ' + p.vitri : '');
      if (s.textContent) b.appendChild(s);
      b.onclick = function () {
        if (co) {
          if (confirm('Xoá gim "' + p.ten + (p.vitri ? ' (' + p.vitri + ')' : '') + '"?')) {
            p.ath = null; p.atv = null; luuNhap(); veTI(); veTool();
          }
          return;
        }
        chonGim = (chonGim === i) ? null : i;
        nhacTro(chonGim !== null
          ? 'Bấm lên ảnh chỗ "' + p.ten + (p.vitri ? ' — ' + p.vitri : '') + '" nằm'
          : '');
        veTool();
      };
      L.appendChild(b);
    });
  });
  var xongAll = TI.filter(function (p) { return p.ath !== null; }).length;
  document.getElementById('tool-dem').textContent = 'Đã chấm ' + xongAll + '/' + TI.length;
}
function timNhom(id) {
  return NHOM.some(function (g) { return g.id === id; });
}

if (TOOL) {
  /* 🔴 BAY 54 (15/09) - handler nay bat o pha CAPTURE (tham so `true`), chay
     TRUOC handler cua chinh phan tu dich => `stopPropagation` viet o cho khac
     VO TAC DUNG. Moi khoi noi them len trang PHAI duoc khai vao danh sach
     loai tru ngay day, khong tu chan tu phia no duoc. */
  document.addEventListener('click', function (e) {
    if (chonGim === null || !kp || !TI.length) return;
    /* 🔴 `.ti` CO Y KHONG nam trong danh sach nay (do that 15/09 dot 2).
       Ban dau co, hau qua: dang chon mot dong ma bam trung cho DA CO gim thi
       KHONG cham duoc, camera bay toi gim do. Voi 39 gim thi nhan che gan het
       khu trung tam => Anh Tony khong cham noi cac diem nam sau gim cu.
       Dang o che do cham thi CA MAN HINH la vung cham, ke ca tren gim. */
    /* 🔴 16/09: them #eraGlobe + #eraZoom (qua cau dieu huong + thanh zoom).
       Thieu 2 dong nay thi dang mo ?tool=1 ma bam nut zoom = CHAM NHAM mot diem
       len anh — era-globe.js khong tu chan duoc vi handler nay o pha CAPTURE. */
    if (e.target.closest('#tool') || e.target.closest('#nav') ||
        e.target.closest('#xuat') || e.target.closest('#brand') ||
        e.target.closest('#bang') || e.target.closest('#mo-bang') ||
        e.target.closest('#tro') ||
        e.target.closest('#eraGlobe') || e.target.closest('#eraZoom')) return;
    /* Chan cu bam lai chinh phan tu dich: khong chan thi onclick cua `.ti`
       chay tiep va BAY CAMERA ngay sau khi vua dat diem - giat man hinh.
       Chan o day duoc vi handler nay o pha CAPTURE, chay TRUOC (bay 54). */
    e.stopPropagation(); e.preventDefault();
    var r = document.getElementById('pano').getBoundingClientRect();
    var sw = +kp.get('stagewidth') || r.width, sh = +kp.get('stageheight') || r.height;
    /* JS API - truyen so qua kp.call() thi tham so KHONG vao duoc (bay 46) */
    var sp = kp.screentosphere((e.clientX - r.left) * (sw / r.width),
                               (e.clientY - r.top) * (sh / r.height));
    TI[chonGim].ath = Math.round(sp.x * 10) / 10;
    TI[chonGim].atv = Math.round(sp.y * 10) / 10;
    chonGim = null; luuNhap(); veTI(); veTool(); nhacTro('');
  }, true);

  document.getElementById('b-them').onclick = function () {
    var ten = prompt('Tên tiện ích muốn thêm\n(cái nào có trên ảnh mà Em Tèo đọc sót)');
    if (!ten || !ten.trim()) return;
    var ds = NHOM.map(function (g, i) { return (i + 1) + ' = ' + g.ten; }).join('   ·   ');
    var g = prompt('Thuộc nhóm nào?\n' + ds, '5');
    var idx = parseInt((g || '').trim(), 10) - 1;
    var nhom = (NHOM[idx] && NHOM[idx].id) || NHOM[NHOM.length - 1].id;
    TI.push({ id: 'them-' + Date.now(), ten: ten.trim(), vitri: '', nhom: nhom,
              icon: 'cham', ath: null, atv: null, them: true });
    luuNhap(); veTI(); veTool();
  };

  document.getElementById('b-xuat').onclick = function () {
    var q = {};
    TI.forEach(function (p) {
      if (p.ath === null) return;
      q[p.id] = { ten: p.ten, nhom: p.nhom, ath: p.ath, atv: p.atv };
      if (p.vitri) q[p.id].vitri = p.vitri;
      if (p.icon)  q[p.id].icon  = p.icon;
      if (p.them)  q[p.id].them  = true;
    });
    document.getElementById('xuat-txt').value =
      JSON.stringify({ tien_ich: q }, null, 1);
    document.getElementById('xuat').classList.add('hien');
  };
  document.getElementById('b-chep').onclick = function () {
    var t = document.getElementById('xuat-txt'); t.select(); document.execCommand('copy');
    var me = this; me.textContent = 'ĐÃ CHÉP';
    setTimeout(function () { me.textContent = 'CHÉP'; }, 1400);
  };
  document.getElementById('b-dong').onclick = function () {
    document.getElementById('xuat').classList.remove('hien');
  };
  document.getElementById('b-xoa').onclick = function () {
    if (confirm('Xoá nháp đã chấm trong trình duyệt?')) {
      try { localStorage.removeItem(KHOA); } catch (e) {}
      location.reload();
    }
  };
}
</script>
