<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
/* ============================================================
   BUOC 3 "GIO HANG" - dung chung token + kieu nut .k3d voi 2 tab kia.
   Anh Tony chot 12/09: lan nay CHI lam GOC NHIN, phan gim lo lam sau.
   => Trang nay co dung mot thu: mo ra dung khung hinh Anh gui.
      KHONG them nut, KHONG them bang - da tung bi nhac vi tu them (bo box 12/09).
   ============================================================ */
:root{
  --wp-primary:#003C4B; --wp-primary-hover:#006D88; --wp-primary-tint:#7FD3E3;
  --wp-canvas:#000000; --wp-hairline:#005A70; --wp-on-primary:#FFFFFF;
  --wp-text:#FFFFFF; --wp-text-soft:rgba(255,255,255,.9);
  --wp-text-muted:rgba(255,255,255,.6); --wp-text-disabled:rgba(255,255,255,.3);
  --wp-surface-360:#0A1214;
  --wp-overlay-nav:rgba(0,60,75,.9); --wp-overlay-soft:rgba(0,60,75,.3);
  --wp-font:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --wp-fw-thin:100; --wp-fw-regular:400; --wp-fw-bold:700;
  --wp-fs-body:16px; --wp-fs-label:12px;
  --wp-space-xxs:4px; --wp-space-xs:8px; --wp-space-sm:12px;
  --wp-space-md:16px; --wp-space-lg:24px; --wp-space-xl:32px;
  --wp-control-h:40px; --wp-control-h-lg:48px; --wp-nav-h:52px;
  --wp-z-overlay:50; --wp-z-toast:999999999;
  --wp-vang:#E0B14A; --wp-canh-teal:#00232C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--wp-canvas);
  font-family:var(--wp-font);color:var(--wp-text);-webkit-tap-highlight-color:transparent}
#pano{position:fixed;inset:0;background:var(--wp-surface-360)}
button{font-family:var(--wp-font);cursor:pointer;border:0}

/* ===== NUT THEO FILE Group.svg Anh Tony gui 12/09 - DO THANG TU PATH =====
   BO 2 GOC DOI NHAU (tren-phai · duoi-trai), ban kinh = 34% chieu cao.
   Hai goc con lai VUONG. KHONG he co vat cheo.
   🔴 Co file SVG thi DOC PATH, dung doan tu anh chup (da sai 4 lan).
   ========================================================================= */
.k3d{
  --r:18px; --nen:var(--wp-primary);
  border-radius:0 var(--r) 0 var(--r);
  background:var(--nen);
  color:var(--wp-text);
  box-shadow:3px 3px 14px rgba(0,0,0,.26);
  transition:background .15s, box-shadow .15s, transform .08s;
}
.k3d:hover{--nen:var(--wp-primary-hover);background:var(--nen)}
.k3d:active,.k3d.nhan-xuong{transform:translateY(2px);
  box-shadow:1px 1px 6px rgba(0,0,0,.30)}
/* nut khong dung duoc: doi MAU NEN dac, KHONG dung opacity */
.k3d:disabled{--nen:#0A2A34;background:var(--nen);color:rgba(255,255,255,.38);
  box-shadow:2px 2px 10px rgba(0,0,0,.22);cursor:not-allowed}
.k3d:disabled:hover{--nen:#0A2A34;background:var(--nen)}
.k3d:disabled:active{transform:none}

/* Ban kinh = 34% chieu cao, tinh rieng tung co */
.tab{--r:18px}     /* cao 52px */
#brand{--r:18px}

/* ---- Brand ---- */
#brand{position:fixed;top:var(--wp-space-md);left:var(--wp-space-md);z-index:var(--wp-z-overlay);
  min-height:var(--wp-nav-h);display:flex;align-items:center;gap:var(--wp-space-sm);
  padding:var(--wp-space-xs) var(--wp-space-md);cursor:default}
#brand:hover{--nen:var(--wp-primary)}
#brand:active{transform:none}
#brand img{height:28px;width:auto;display:block}
#brand .ten{font-size:var(--wp-fs-body);color:var(--wp-text);letter-spacing:.5px;line-height:1.15}
#brand .phu{font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);
  letter-spacing:1px;text-transform:uppercase;color:var(--wp-primary-tint);line-height:1.3}

/* ---- Thanh 3 buoc ---- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--wp-space-xl);
  z-index:var(--wp-z-overlay);display:flex;align-items:flex-start;gap:var(--wp-space-xs);
  max-width:calc(100vw - var(--wp-space-xl));overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:var(--wp-nav-h);padding:0 var(--wp-space-lg);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:1.1px;
  text-transform:uppercase;white-space:nowrap}
.tab.on{--nen:var(--wp-primary-hover)}

#tai{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;
  font-size:var(--wp-fs-label);letter-spacing:1px;color:var(--wp-text-muted);
  max-width:calc(100vw - var(--wp-space-xl));text-align:center;line-height:1.6}

/* ---- Dai chip chon canh con (16/09) ----
   🔴 CHEP Y CONG THUC cua `#ds` ben trang Thuc te, KHONG tu nghi ra so moi.
   `--ds-chua` = be ngang phai chua trong o mep PHAI cho qua cau dieu huong;
   mac dinh 0, `era-globe.js` dat lai con so theo tung kho man - va file do
   DA duoc nap san o trang nay (dong script cuoi body). Chua mot ben nen
   TRU MOT LAN roi DOI TAM sang trai NUA khoang do, khong tru ca hai ben
   (do that ben kia: iPhone doc mat oan 84px).
   ⚠️ `bottom` phai dung y cong thuc nay - quả cầu, thanh zoom va thanh buoc
   deu neo theo no. Doi la xo lech het.
   ⚠️ KHONG chep lop mui ten `#ds-dh`/`#ds-dem` sang day: lop do sinh ra cho
   dai 5 canh bi tran tren dien thoai. O day chi 2 chip, khong bao gio tran. */
#ds{position:fixed;left:calc(50% - var(--ds-chua,0px) / 2);
  transform:translateX(-50%);
  bottom:calc(var(--wp-space-xl) + var(--wp-nav-h) + var(--wp-space-sm));
  max-width:calc(100vw - var(--wp-space-xl) - var(--ds-chua,0px));
  z-index:var(--wp-z-overlay);display:flex;align-items:flex-start;
  gap:var(--wp-space-xs);overflow-x:auto;scrollbar-width:none;
  padding:0 var(--wp-space-xxs) 6px}
#ds::-webkit-scrollbar{display:none}
.o{flex:0 0 auto;height:var(--wp-control-h);padding:0 var(--wp-space-md);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:1px;
  text-transform:uppercase;white-space:nowrap}
.o.on{--nen:var(--wp-primary-hover)}

/* 🔴 Do that 12/09: dien thoai XOAY NGANG chi cao ~390px -
   phai co CA max-width LAN max-height, `max-width` khong bat duoc ca nay. */
@media (max-height:600px){
  #nav{bottom:var(--wp-space-sm)}
  /* Chip phai tut theo thanh buoc, chep y cong thuc trang Tong quan.
     ⚠️ Khoi nay hien KHONG an thua vi `era-buoc.js` nap sau nen ghi de
     `#nav{bottom}`. Van giu lai: file do quang cao la ADDITIVE, go 1 dong
     <script> la tra ve nhu cu - luc do khoi nay phai con dung. */
  #ds{bottom:calc(var(--wp-space-sm) + var(--wp-nav-h) + var(--wp-space-xxs))}
  .tab{height:44px;padding:0 var(--wp-space-md)}
  #brand{padding:var(--wp-space-xxs) var(--wp-space-sm);min-height:40px}
}
@media (max-width:568px){
  .tab{padding:0 var(--wp-space-sm);letter-spacing:.6px}
  .o{padding:0 var(--wp-space-sm);letter-spacing:.6px}
}
</style>

<div id="brand" class="k3d">
  <img id="logo-era" src="../skin/logo-era.png" alt="ERA Vietnam" onerror="this.remove()">
  <div>
    <div class="ten">WATERPOINT</div>

  </div>
</div>

<div id="ds"></div>
<nav id="nav"></nav>
<div id="tai">Đang tải cảnh 360…</div>

<script src="../krpano.js"></script>
<script>
var kp = null;

/* veNav() da chuyen sang file dung chung `era-buoc.js` (15/09) */

/* ============================================================
   🔴🔴 BAY 50 - DUA VE GOC NHIN THANG XUONG (nadir)

   Hai thu KHONG chay, da thu va da bo:
     1. Dat thang vlookat="90" trong <view> cua scene
        -> krpano BO QUA hlookat (nadir la diem ky di, camera khong con
           huong "len" xac dinh). Do h=0 va h=90, o ca v=89 lan v=90:
           BON lan ra anh GIONG HET NHAU, xoay 90 do so voi anh Anh Tony.
           🔴 Doc so bao ve van thay dung "hlookat: 90" -> rat de tuong dung.
     2. <action> + delayedcall trong tour.xml -> khong chay (view van dung
        nguyen o <view>, do duoc h=5 v=45 fov=105).

   ✅ Cach chay: vao canh o goc THUONG (v=45 nhu canh5), doi cho <view>
      va onstart chay xong, ROI MOI xoay xuong nadir bang JS.
      Luc do hlookat con y nghia nen krpano giu dung goc xoay.

   Dat 2 lan (700ms va 1600ms) cho chac - lan dau co the con vuong
   hoat canh mo canh. Nguoi xem keo chuot roi thi THOI, khong giat lai.
   ============================================================ */
/* 🔴 fovtype HFOV, KHONG phai VFOV (mac dinh).
   Do that tren iPad gen 9 NGANG (1080x810): de VFOV=80 thi man cang hep
   cang thay it BE NGANG -> khu dat BI CAT MAT MEP PHAI. Trang gio hang
   ma cat mat lo la hong han.
   HFOV khoa be ngang lai: man hep thi thay THEM tren/duoi, khu dat van
   con nguyen. 117 = quy doi tu vfov 80 o khung 1920x986:
     hfov = 2*atan( tan(80/2) * 1920/986 ) = 117.1  */
/* ============================================================
   🔴 DANH SACH CANH CON - MOT CHO DUY NHAT  (16/09)

   Anh Tony chot 16/09: gio hang co 2 phan khu ERA. Doi chieu
   `tong-quan/phan-khu.json` thi dung 2 muc co `era:true` la
   `aquaria` va `park-village` - khop.

   Them/bo/doi ten canh con thi SUA O DAY, khong sua cho nao khac -
   dung bai hoc `era-buoc.js` (tab hard-code 4 cho, da dinh that 15/09).

   `goc` = khung hinh nadir cua tung canh, DO BANG MAY chu khong doan
   (xem BAY 50 + ghi chu fovtype HFOV ngay phia tren).

   `lechBac` = YAW CUA DRONE luc chup, doc thang tu EXIF `GimbalYawDegree`
   cua anh goc. Bac that nam o `ath = -lechBac`. Quan he `bearing = ath + yaw`
   da duoc phien `chat-gps-poi` nghiem thu sang 16/09 (16/20 cap canh khop
   dung 0,0 do).
   🔴 THEM CANH MOI THI PHAI KHAI CA `lechBac`. Thieu = coi nhu 0 = la ban
      va qua cau deu coi `hlookat 0` la Bac => CHI SAI, va sai IM LANG,
      khong co loi nao bao. Lay so bang:
        python -c "b=open(r'<anh goc>','rb').read(300000); i=b.find(b'GimbalYawDegree'); print(b[i:i+32])"
   ============================================================ */
var CANH = [
  /* ---- PK The Aqua ---- dung lai anh cua canh5 ben trang Thuc te
     (`../pano/05-aquaria-song-vam-co/`), chi khac goc nhin.
     yaw 172,3 - khop dung `_yaw` cua `canh5_aquaria_song_vam_co`
     trong `canh.json`. `_kiem-laban.py` doi chieu lai cho nay moi lan chay. */
  { id: 'pk_aqua', ten: 'PK The Aqua', lechBac: 172.3,
    goc: { h: 0, v: 90, fov: 113, fovtype: 'HFOV' } },

  /* ---- PK Park Village ---- anh that gan 16/09 chieu.
     Anh nguon: `02-NGUON/anh-360/waterpoint/1-tong-the/pk park village.jpg`
     (chinh la `DJI_0482.jpg` cu, Anh Tony doi ten - md5 887eaa5a…,
      8192x4096, DJI FC3170, bay 05/09 11:46, cao 360,2 m, yaw -63,3).
     Tile: `../pano/08-park-village/` - 295 file, dung y so luong canh Aqua.

     🔴 GOC NHIN DO BANG MAY, KHONG DOAN (16/09):
       h = 0   v = 90   fov = 78
     Cach ra so nay: dung lai phep chieu nadir cua krpano bang Python
     (gnomonic, fovtype=HFOV), roi doi chieu 9 cap tren bang anh
     (fov 62/70/78 x h -8/0/8/16), co ke duong chuan ngang de soi do nghieng.
       · v=90 thi cum oval DA NAM DUNG TAM san - lech tam chi ~10 px/1280,
         nen KHONG phai keo vlookat ra khoi nadir.
       · fov 62 = CAT MAT hai dau oval · fov 70 = sat le trai
         · fov 78 = tron cum + tron vong kenh, con le deu. Chot 78.
       · h = 0: o fov 78 truc dai cua oval DA gan nhu nam ngang san
         (lech ~3 do). Da thu h = -8 va +8, CA HAI deu lam no nghieng
         THEM chu khong thang ra.
     ⚠️ Vi sao khong co xoay: quy uoc DAU cua `hlookat` trong ban mo phong
        cua Em chua doi chieu duoc voi krpano that (nadir la diem ky di,
        khong co cach kiem bang so). De h=0 thi cau hoi do khong con y nghia
        - khong con rui ro xoay nguoc chieu. Neu Anh Tony nhin thay muon
        nan cho that thang thi sua DUY NHAT so `h` o day, thu +3 va -3.
     ⚠️ So nay do tren khung 16:9. `fovtype HFOV` khoa be ngang nen man
        hep hon chi thay THEM tren/duoi, cum dat van nguyen - xem ghi chu
        HFOV phia tren. */
  /* yaw -63,30 = `drone-dji:GimbalYawDegree` doc thang tu
     `02-NGUON/anh-360/waterpoint/1-tong-the/pk park village.jpg`.
     ⚠️ DUNG lay `FlightYawDegree` (-43,40) - do la huong THAN DRONE,
        khong phai huong GIMBAL. `canh.json` cung lay GimbalYawDegree. */
  { id: 'pk_park_village', ten: 'PK Park Village', lechBac: -63.3,
    goc: { h: 0, v: 90, fov: 78, fovtype: 'HFOV' } }
];

/* ============================================================
   MOC NOI DO LECH BAC cho `era-globe.js` + `era-laban.js`  (16/09)

   🔴 PHAI LA HAM, khong duoc la mot con so chet: trang nay co 2 canh,
      moi canh mot yaw khac han (172,3 va -63,3). Khai so chet thi canh
      thu hai lech 235 do.
   Ca hai file deu tu tra ve 0 neu thieu moc nay => go 2 dong <script>
   cuoi body la trang ve y nhu cu, khong con gi thua.
   ============================================================ */
window.ERA_LECH_BAC = function () {
  var c = timCanh(canhDang);
  return (c && isFinite(c.lechBac)) ? c.lechBac : 0;
};

var nguoiDaKeo = false;
var canhDang = CANH[0].id;

function timCanh(id) {
  for (var i = 0; i < CANH.length; i++) if (CANH[i].id === id) return CANH[i];
  return null;
}

function veGocChuan() {
  if (!kp || nguoiDaKeo) return;
  var c = timCanh(canhDang); if (!c) return;
  kp.set('view.fovtype', c.goc.fovtype);
  kp.set('view.hlookat', c.goc.h);
  kp.set('view.vlookat', c.goc.v);
  kp.set('view.fov', c.goc.fov);
}

/* An chu "Dang tai canh 360…" khi canh da san sang.
   Nhanh `chua_co_anh` la LUOI AN TOAN cho canh chua cat tile: mo ra se den,
   rat de bi chan doan nham la loi (bay T12). Hien 16/09 CA HAI canh deu co
   anh that nen nhanh do khong chay - giu lai de them phan khu moi thi chi
   phai them mot dong co, khoi viet lai.
   Bao bang CHINH `#tai` da co san, KHONG thêm bang/nut moi
   (Anh Tony da nhac 12/09: trang nay chi lam mot thu, dung tu them). */
function baoThieuAnh() {
  var t = document.getElementById('tai'); if (!t) return;
  var c = timCanh(canhDang);
  if (c && c.chua_co_anh) {
    t.textContent = c.ten + ' — chưa có ảnh 360. Khung đã dựng sẵn, ' +
                    'cắt tile vào pano/08-park-village/ là chạy.';
    t.style.display = '';
  } else {
    t.style.display = 'none';
  }
}

function veDS() {
  var L = document.getElementById('ds'); if (!L) return;
  L.innerHTML = '';
  CANH.forEach(function (c) {
    var e = document.createElement('button');
    e.type = 'button';
    e.className = 'k3d o' + (c.id === canhDang ? ' on' : '');
    e.dataset.id = c.id;
    e.textContent = c.ten;
    e.onclick = function () { doiCanh(c.id); };
    L.appendChild(e);
  });
}

function doiCanh(id) {
  if (!kp || id === canhDang) return;
  canhDang = id;
  /* 🔴 `loadscene(ten, ...)` KHONG nhay - y het `doiCanh()` trang Thuc te.
     Vi vay ten scene ben tour.xml phai dung GACH DUOI, khong gach ngang. */
  kp.call('loadscene(' + id + ', null, MERGE, BLEND(1.0))');
  /* Doi canh la nguoi xem CO Y muon xem khung chuan cua canh do
     => xoa co "da keo", roi lai xoay xuong nadir theo dung BAY 50. */
  nguoiDaKeo = false;
  veDS();
  baoThieuAnh();
  setTimeout(veGocChuan, 700);
  setTimeout(veGocChuan, 1600);
}

embedpano({
  xml: 'tour.xml',
  target: 'pano',
  html5: 'auto',
  passQueryParameters: 'startscene,startlookat',
  onready: function (k) {
    kp = k;
    /* Mo bang ?startscene=... thi canh that co the KHAC CANH[0]
       -> hoi lai krpano chu dung doan, keo khong thi chip sang sai o. */
    var s = kp.get('xml.scene');
    if (s && timCanh(s)) canhDang = s;
    veDS();
    baoThieuAnh();
    /* 🔴 Listener KHONG con `{once:true}`: doi canh xong phai bat lai duoc
       lan keo tiep theo, khong thi tu canh thu hai tro di keo chuot la
       `veGocChuan` van giat khung hinh ve cho cu. */
    document.addEventListener('pointerdown', function () { nguoiDaKeo = true; });
    setTimeout(veGocChuan, 700);
    setTimeout(veGocChuan, 1600);
  }
});
</script>
